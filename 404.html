<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cYHBernews | Redirigiendo...</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0d1117">
    <script>
        (function() {
            var path = window.location.pathname;
            var match = path.match(/\/(?:share|noticia)\/([^\/]+)/i);
            if (match && match[1]) {
                window.location.replace('/?noticia=' + encodeURIComponent(match[1]));
                return;
            }
            window.location.replace('/');
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div>
        <h2>Redirigiendo a cYHBernews...</h2>
        <p><a href="/">Haz clic aquí si no eres redirigido automáticamente</a></p>
    </div>
</body>
</html>
